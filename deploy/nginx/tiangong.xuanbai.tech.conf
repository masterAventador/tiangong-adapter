server {
    listen 80;
    listen [::]:80;
    server_name tiangong.xuanbai.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://tiangong.xuanbai.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tiangong.xuanbai.tech;

    ssl_certificate /etc/letsencrypt/live/tiangong.xuanbai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiangong.xuanbai.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    default_type text/plain;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Retry-After "3600" always;

    location / {
        return 503 "Tiangong is unavailable until unified login is enabled.\n";
    }
}
